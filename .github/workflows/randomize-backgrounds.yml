name: Randomize backgrounds

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "images/**"
      - "generate_background_css.py"
      - ".github/workflows/randomize-backgrounds.yml"

permissions:
  contents: write

concurrency:
  group: randomize-backgrounds
  cancel-in-progress: false

jobs:
  randomize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate randomized background CSS
        run: python generate_background_css.py

      - name: Commit updated background order
        run: |
          if git diff --quiet -- generated-backgrounds.css; then
            echo "generated-backgrounds.css did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated-backgrounds.css
          git commit -m "Randomize background order"

          git pull --rebase origin main
          git push origin main
